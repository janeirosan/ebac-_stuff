<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some typa form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="container my-5 rounded">
        <h1 class="display p-3">table or wtv</h1>
        <form class="row g-3 p-4 w-75">
            <div class="col-5">
                <label for="inputName" class="form-label">What should we call you?</label>
                <input name="inputName" type="text" class="form-control" placeholder="Name">
            </div>
            <div class="col-7"></div>
            <div class="col-4">
                <label for="inputPhone" class="form-label">What is your phone number?</label>
                <input name="inputPhone" type="tel" class="form-control" placeholder="+55 (11) 90000-0000">
            </div>
            <div class="col-6">
                <label for="inputEmail" class="form-label">What is your email?</label>
                <input name="inputEmail"type="email" class="form-control" placeholder="e-mail@example.com">
            </div>
            <div class="mb-1 col-10">
                <label for="inputMsg" class="form-label">Your Message:</label>
                <textarea name="inputMsg" class="form-control" rows="6" placeholder="Wow this is so well done!"></textarea>
            </div>
            <div class="mb-3 d-flex align-items-start col-10">
                <input type="checkbox" class="me-2 form-check-input" id="exampleCheck1" required>
                <label class="form-check-label lh-sm" for="exampleCheck1">You understand that we are not storing information and this is simply a form made for practice purposes.</label>
                </div>
            <button class="btn btn-outline-dark btn-lg col-10">Send</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
