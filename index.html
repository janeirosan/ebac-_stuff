<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="utils.css">
    <title>Pokémon Gym Challenge 2024 - Galar Region</title>
</head>
<body>
    <header></header>
    <main>
        <div class="container">
            <h1>Pokémon Gym Challenge 2024</h1>
            <h3>Galar Region Sign-Ups</h3>
            <section>
                <!-- note: i decided against using the placeholder attribute because not all screen readers can read it -->
                <form action="/" method="post" id="poke-form">
                    <label for="name">How would you like to be called?<input type="text" id="name" autocomplete="off" required><br></label>
                    <label for="age">
                        How old are you? 
                        <input type="number" id="age" autocomplete="off" required>
                        <span id="notice-false">Please note that your shirt number should be higher than your age.</span><br>
                    </label>
                    <label for="shirtnum">What number would you like to have on the back of your shirt?<input type="number" id="shirtnum" required><br></label>
                    <label for="reason">Please write down your reason for joining the Challenge below! (Optional)<textarea id="reason"></textarea><br></label>
                    <button type="submit" id="btn-send" disabled>send application</button>
                    <p id="notice-scss"></p><br>
                </section>
            </form>
        </div>
    </main>
    <footer></footer>
    <script src="main.js"></script>
</body>
</html>
